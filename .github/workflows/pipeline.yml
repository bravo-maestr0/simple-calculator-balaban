name: Multi-stage Pipeline

on:
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install tools
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Compile tests
      run: g++ tests/test.cpp simple-calculator-balaban/calculator.cpp simple-calculator-balaban/input.cpp -o test

    - name: Run tests
      run: ./test
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Compile project
      run: g++ simple-calculator-balaban/*.cpp -o calculator

    - name: Create artifact
      run: echo "Build successful" > build.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: build.txt
  deploy_staging:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: build-artifact

    - name: Deploy to staging (simulation)
      run: |
        echo "Deploying to staging..."
        cat build.txt
